<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0e7ff"/>
    </linearGradient>
  </defs>
  
  <!-- Hexagon Background -->
  <polygon 
    points="32,2 58,17 58,47 32,62 6,47 6,17" 
    fill="url(#bgGrad)"
  />
  
  <!-- Inner Hexagon Border -->
  <polygon 
    points="32,6 54,19 54,45 32,58 10,45 10,19" 
    fill="none" 
    stroke="rgba(255,255,255,0.2)" 
    stroke-width="1"
  />
  
  <!-- Code Brackets -->
  <text x="12" y="40" font-family="monospace" font-size="20" font-weight="bold" fill="rgba(255,255,255,0.6)">&lt;</text>
  <text x="44" y="40" font-family="monospace" font-size="20" font-weight="bold" fill="rgba(255,255,255,0.6)">/&gt;</text>
  
  <!-- Stylized J -->
  <path 
    d="M32 18 L32 38 Q32 46 24 46" 
    fill="none" 
    stroke="url(#letterGrad)" 
    stroke-width="4" 
    stroke-linecap="round"
  />
  
  <!-- Accent Dot -->
  <circle cx="32" cy="16" r="2.5" fill="#06b6d4"/>
</svg>
